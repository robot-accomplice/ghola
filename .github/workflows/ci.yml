name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --config .github/.golangci.yml

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Coverage gates (80% floor + no regression)
        run: scripts/check-coverage.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags "-s -w" -o /dev/null ./cmd/ghola

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # Runs ghola, curl, wget and aria2 on the same jobs (test/parity). The job
  # fails when ghola regresses, or when a known failure starts to pass and
  # test/parity/known.go was not updated. Images are pinned, not -latest, so
  # the reference tool versions change only in a deliberate change.
  parity:
    name: Parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install reference tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wget2 aria2

      - name: Install reference tools (macOS)
        if: runner.os == 'macOS'
        run: brew install aria2 wget2 || brew install aria2 wget

      - name: Install reference tools (Windows)
        if: runner.os == 'Windows'
        run: choco install -y --no-progress aria2 wget

      - name: Run parity harness
        env:
          PARITY_OUT: ${{ runner.temp }}/parity-out
        run: go test -tags parity -count=1 -timeout 20m -v ./test/parity/

      - name: Upload parity records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/parity-out/results.json
            ${{ runner.temp }}/parity-out/summary.md

  scope:
    name: Scope (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to a commit SHA, not the `1.97.1` ref -- in this action the
      # toolchain names are branches, which are mutable and force-pushable.
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path scope/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path scope/Cargo.toml -- -D warnings

      - name: Test
        run: cargo test --manifest-path scope/Cargo.toml
