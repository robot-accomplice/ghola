version: 2

project_name: ghola

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - main: ./cmd/ghola
    binary: ghola
    ldflags:
      - -s -w
      - -X github.com/robot-accomplice/ghola/internal/config.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

brews:
  - name: ghola
    repository:
      owner: robot-accomplice
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "brew: bump {{ .ProjectName }} to {{ .Tag }}"
    homepage: "https://github.com/robot-accomplice/ghola"
    description: "High-performance Go HTTP client for blockchain forensic analysis and browser-like URL fetching"
    license: "MIT"
    skip_upload: auto
    install: |
      bin.install "ghola"
    test: |
      system "#{bin}/ghola", "--version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
