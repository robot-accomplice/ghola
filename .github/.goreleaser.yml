version: 2

project_name: ghola

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - main: ./cmd/ghola
    binary: ghola
    ldflags:
      - -s -w
      - -X github.com/robot-accomplice/ghola/internal/config.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: ghola
    package_name: ghola
    vendor: robot-accomplice
    homepage: https://github.com/robot-accomplice/ghola
    maintainer: robot-accomplice-bot <bot@robot-accomplice.github.io>
    description: High-performance Go HTTP client for blockchain forensic analysis and browser-like URL fetching
    license: MIT
    formats:
      - rpm
      - deb
      - apk
      - archlinux
    bindir: /usr/bin
    # Match the uniform release asset naming (ghola_<version>_<os>_<arch>) used by
    # the tarballs, install scripts, and Homebrew formula. The package's internal
    # arch metadata is still set correctly per format (e.g. x86_64 for rpm).
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
